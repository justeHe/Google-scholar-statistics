<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scholar First/Corresponding Metrics Settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="options">
      <h1>Scholar First/Corresponding Metrics</h1>
      <form id="settings-form">
        <section>
          <h2>Author matching</h2>
          <label>
            Author aliases
            <textarea id="aliases" rows="5" placeholder="One alias per line"></textarea>
          </label>
        </section>
        <section>
          <h2>Page behavior</h2>
          <label class="check"><input id="autoLoadAll" type="checkbox">Automatically load all papers (Show more)</label>
          <label class="check"><input id="detailFetchEnabled" type="checkbox">Complete truncated author lists from detail pages</label>
        </section>
        <div class="actions">
          <button type="submit">Save</button>
          <button type="button" id="reset">Reset defaults</button>
          <button type="button" id="clear-cache">Clear cache</button>
        </div>
      </form>
      <p id="status" class="status"></p>
    </main>
    <script src="../shared/constants.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="options.js"></script>
  </body>
</html>
